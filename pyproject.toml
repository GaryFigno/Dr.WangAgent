[project]
name = "aiharness"
version = "0.1.0"
description = "Dr.Wang Agent — a Claude Code-like coding agent harness that runs on any OpenAI-compatible LLM API"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "textual>=0.79",
    "rich>=13.7",
    "platformdirs>=4.2",
    "aiohttp>=3.9",
    "pywebview>=5.0",
    "pystray>=0.19",
]

[project.optional-dependencies]
# Screen, mouse and keyboard control. Off unless enabled in config — read the
# warning in aiharness/tools/computer.py before turning it on.
desktop = [
    "pyautogui>=0.9.54",
    "pillow>=10.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pillow>=10.0",
]

[project.scripts]
aih = "aiharness.cli:main"
aiharness = "aiharness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["aiharness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "PL"]
ignore = [
    # Deferred imports are load-bearing here: the workflow tools depend on the
    # agent loop and the agent loop depends on the tool base types, so those
    # imports live inside functions to break the cycle. See toolset.py.
    "PLC0415",
    # Dispatchers (permission checks, slash commands, stream event handling)
    # are branchy by nature; splitting them would scatter one decision across
    # several functions without making it easier to follow.
    "PLR0911",  # too many return statements
    "PLR0912",  # too many branches
    "PLR0915",  # too many statements
    "PLR0913",  # too many arguments
    "PLR0917",  # too many positional arguments
    "E501",     # line length is a formatter concern
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004"]  # literal comparisons are the point of a test
